<!DOCTYPE html>
<html>
<head>
    <title>History</title>
    <style>
        body { font-family: Arial; background:#f4f6f9; padding:20px; }
        table { width:100%; border-collapse:collapse; background:white; }
        th,td { padding:10px; border:1px solid #ddd; text-align:center; }
        th { background:#4e73df; color:white; }
        button { padding:8px; background:#4e73df; color:white; border:none; border-radius:5px; }
    </style>
</head>
<body>

<a href="/"><button>⬅ Back</button></a>

<h2>📜 Backup & Restore History</h2>

<table>
<tr>
<th>File Name</th>
<th>Action</th>
<th>Location</th>
<th>Date & Time</th>
</tr>

{% for row in records %}
<tr>
<td>{{ row[0] }}</td>
<td>{{ row[1] }}</td>
<td>{{ row[2] }}</td>
<td>{{ row[3] }}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
