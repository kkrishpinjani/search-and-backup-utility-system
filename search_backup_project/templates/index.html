<!DOCTYPE html>
<html>
<head>
    <title>Search & Backup System</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg,#4e73df,#1cc88a);
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }
        .container {
            background:white;
            width:450px;
            padding:25px;
            border-radius:10px;
            box-shadow:0 10px 20px rgba(0,0,0,0.2);
        }
        h1 { text-align:center; }

        button {
            width:100%;
            padding:8px;
            margin-bottom:8px;
            border:none;
            border-radius:5px;
            background:#4e73df;
            color:white;
            font-weight:bold;
            cursor:pointer;
        }
        button:hover { background:#2e59d9; }

        input {
            width:100%;
            padding:8px;
            margin-bottom:5px;
            border-radius:5px;
            border:1px solid #ccc;
        }

        .message {
            background:#eef;
            padding:8px;
            margin-bottom:8px;
            border-radius:5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📁 Personal Search & Backup Utility</h1>

    <a href="/history">
        <button style="background:#28a745;">📜 View History</button>
    </a>

    {% with messages = get_flashed_messages() %}
      {% for message in messages %}
        <div class="message">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <h3>Scan Directory</h3>
    <form action="/scan" method="post">
        <input type="text" name="path" placeholder="Enter folder path">
        <button type="submit">Scan</button>
    </form>

    <h3>Search File</h3>
    <form action="/search" method="post">
        <input type="text" name="name" placeholder="Enter file name">
        <button type="submit">Search</button>
    </form>

    <h3>Backup File</h3>
    <form action="/backup" method="post">
        <input type="text" name="path" placeholder="Enter file name or full path">
        <button type="submit">Backup</button>
    </form>

    <h3>Restore Backup</h3>
    <form action="/restore" method="post">
        <input type="text" name="zip_path" placeholder="example: test1.txt.zip">
        <input type="text" name="restore_location" placeholder="Restore location">
        <button type="submit">Restore</button>
    </form>

</div>
</body>
</html>
