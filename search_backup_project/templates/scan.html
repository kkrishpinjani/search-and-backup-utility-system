<!DOCTYPE html>
<html>
<head>
    <title>Scan Directory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-light">

<div class="container mt-4">
    <h2 class="mb-4">📂 Files in Data Folder</h2>

    <table class="table table-dark table-striped">
        <thead>
            <tr>
                <th>File / Folder</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for file in files %}
            <tr>
                <td>{{ file }}</td>
                <td>
                    <form action="/backup" method="POST">
                        <input type="hidden" name="backup_name" value="{{ file }}">
                        <button type="submit" class="btn btn-success btn-sm">Backup</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <a href="/" class="btn btn-light">⬅ Back</a>
</div>

</body>
</html>
