{% extends "base.html" %}
{% block content %}

<h2>Restore Backup</h2>

<form method="POST">
    <label>Select Backup:</label>
    <select name="backup_id">
        {% for b in backups %}
            <option value="{{ b[0] }}">{{ b[1] }}</option>
        {% endfor %}
    </select>

    <input type="text" name="restore_path" placeholder="Restore location path">
    <button type="submit">Restore</button>
</form>

{% endblock %}
