<!DOCTYPE html>
<html>
<head>
    <title>Search & Backup System</title>
</head>
<body>
    <h1>Personal Search & Backup Utility</h1>

    <h3>Scan Directory</h3>
    <form action="/scan" method="post">
        <input type="text" name="path" placeholder="Enter folder path">
        <button type="submit">Scan</button>
    </form>

    <h3>Search File</h3>
    <form action="/search" method="post">
        <input type="text" name="name" placeholder="Enter file name">
        <button type="submit">Search</button>
    </form>

    <h3>Backup File</h3>
    <form action="/backup" method="post">
        <input type="text" name="path" placeholder="Enter file path">
        <button type="submit">Backup</button>
    </form>

    <h3>Restore Backup</h3>
    <form action="/restore" method="post">
        <input type="text" name="zip_path" placeholder="Enter backup zip path">
        <input type="text" name="restore_location" placeholder="Restore location">
        <button type="submit">Restore</button>
    </form>

</body>
</html>
