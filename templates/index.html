<!DOCTYPE html>
<html>
<head>
<title>File Management Dashboard</title>
<style>
body {
    margin:0;
    font-family:Segoe UI;
    background:#0f172a;
    color:white;
}

.dashboard {
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr;
    gap:20px;
    padding:20px;
    height:100vh;
    box-sizing:border-box;
}

.box {
    background:#1e293b;
    padding:20px;
    border-radius:12px;
    overflow:auto;
}

button {
    background:#3b82f6;
    border:none;
    padding:8px 14px;
    color:white;
    border-radius:6px;
    cursor:pointer;
}

input, select {
    padding:6px;
    margin:5px 0;
    border-radius:5px;
    border:none;
}

.result {
    background:#334155;
    padding:10px;
    border-radius:8px;
    margin-top:10px;
}
</style>
</head>
<body>

{% if message %}
<script>alert("{{ message }}")</script>
{% endif %}

<div class="dashboard">

<div class="box">
<h2>🖥 Scan System</h2>
<form method="POST">
<button name="scan">Start Full PC Scan</button>
</form>
</div>

<div class="box">
<h2>🔍 Advanced Search</h2>

<input type="text" id="name" placeholder="File Name">
<input type="text" id="ext" placeholder="Extension (.txt)">
<input type="number" id="size" placeholder="Max Size (bytes)">
<button onclick="search()">Search</button>

<div id="results"></div>
</div>

<div class="box">
<h2>💾 Backup & Restore</h2>

<form method="POST" id="backupForm">
<input type="hidden" name="backup_path" id="backupPath">
</form>

<h3>Restore</h3>
<form method="POST">
<select name="restore_id">
{% for b in backups %}
<option value="{{ b[0] }}">{{ b[1] }}</option>
{% endfor %}
</select>
<button type="submit">Restore</button>
</form>
</div>

<div class="box">
<h2>📜 Backup History</h2>
{% for b in backups %}
<p>{{ b[1] }}<br>{{ b[3] }}</p>
<hr>
{% endfor %}
</div>

</div>

<script>
async function search(){
    let name=document.getElementById("name").value;
    let ext=document.getElementById("ext").value;
    let size=document.getElementById("size").value;

    let res=await fetch(`/search?name=${name}&ext=${ext}&size=${size}`);
    let data=await res.json();

    let resultsDiv=document.getElementById("results");
    resultsDiv.innerHTML="";

    data.forEach(file=>{
        let safePath=file.path.replace(/\\/g,"\\\\");
        resultsDiv.innerHTML+=`
        <div class="result">
        <b>${file.name}</b><br>
        ${file.path}<br>
        Size: ${file.size} bytes<br>
        <button onclick="backup('${safePath}')">Backup</button>
        </div>
        `;
    });
}

function backup(path){
    document.getElementById("backupPath").value=path;
    document.getElementById("backupForm").submit();
}
</script>

</body>
</html>
